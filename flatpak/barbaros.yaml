app-id: io.github.frimn.barbaros
runtime: org.kde.Platform
runtime-version: "6.9" # Версия KDE Runtime, совместимая с PySide6
sdk: org.kde.Sdk
base: io.qt.PySide.BaseApp
base-version: 6.9
build-options:
  env:
    BASEAPP_REMOVE_WEBENGINE: 1
    BASEAPP_DISABLE_NUMPY: 1

command: barbaros # Команда для запуска, должна совпадать с Exec в .desktop и точкой входа
finish-args:
  # Разрешения для GUI-приложения
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri # Для аппаратного ускорения
  - --share=network
  - --socket=session-bus
  - --talk-name=org.freedesktop.secrets  # Разрешение на общение с сервисом паролей
  # Если приложению нужен доступ к файлам пользователя:
  # - --filesystem=home

cleanup-commands:
  - /app/cleanup-BaseApp.sh
  - rm -rf /app/bin/pyside6-*
  - rm -rf /app/lib/python3.*/site-packages/PySide6/assistant
  - rm -rf /app/lib/python3.*/site-packages/PySide6/designer
  - rm -rf /app/lib/python3.*/site-packages/PySide6/linguist
  - rm -rf /app/lib/python3.*/site-packages/PySide6/examples
  - rm -rf /app/lib/python3.*/site-packages/PySide6/Qt/qml
  - rm -rf /app/lib/python3.*/site-packages/PySide6/Qt/translations/qtwebengine_locales

modules:
  - name: barbaros
    build-options:
      build-args:
        - --share=network
    buildsystem: simple
    build-commands:
      - echo ${FLATPAK_DEST} # /app
      - echo ${PWD} # /run/build/barbaros
      # Установка приложения с помощью pip
      - pip3 install --verbose --exists-action=i --find-links="file://${PWD}/dist" --prefix=${FLATPAK_DEST} "barbaros"
      # Копирование файлов
      - install -Dm644 io.github.frimn.barbaros.desktop /app/share/applications/io.github.frimn.barbaros.desktop
      - install -Dm644 icon3.png /app/share/icons/hicolor/256x256/apps/io.github.frimn.barbaros.png
    sources:
      # Укажите источник кода вашего приложения
      # Копируем .tar.gz и .whl файлы
      - type: dir
        path: ../dist
        dest: dist/
      # Также нужно включить файлы данных (.desktop, иконки)
      - type: file
        path: io.github.frimn.barbaros.desktop
      - type: file
        path: icon3.png
      # - type: file
      #   path: io.github.frimn.barbaros.metainfo.xml
    cleanup:
      - "dist/"
