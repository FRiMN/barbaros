app-id: io.github.frimn.barbaros
runtime: org.kde.Platform
runtime-version: "6.11" # KDE Runtime version compatible with PySide6
sdk: org.kde.Sdk
base: io.qt.PySide.BaseApp
base-version: 6.11
build-options:
  env:
    BASEAPP_REMOVE_WEBENGINE: 1
    BASEAPP_REMOVE_PYWEBENGINE: 1
    BASEAPP_DISABLE_NUMPY: 1

command: barbaros # Launch command; must match Exec in the .desktop file and the entry point
finish-args:
  # Permissions for the GUI application
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri # For hardware acceleration
  - --share=network
  - --socket=session-bus
  - --talk-name=org.freedesktop.secrets  # Permission to communicate with the password service
  - --own-name=org.frimn.barbaros
  # If the application needs access to user files:
  # - --filesystem=home

cleanup-commands:
  - /app/cleanup-BaseApp.sh
  - rm -rf /app/bin/pyside6-*
  - rm -rf /app/lib/python3.*/site-packages/PySide6/assistant
  - rm -rf /app/lib/python3.*/site-packages/PySide6/designer
  - rm -rf /app/lib/python3.*/site-packages/PySide6/linguist
  - rm -rf /app/lib/python3.*/site-packages/PySide6/examples
  - rm -rf /app/lib/python3.*/site-packages/PySide6/Qt/qml
  - rm -rf /app/lib/python3.*/site-packages/PySide6/Qt/translations/qtwebengine_locales
  - rm -rf /app/lib/python3.*/site-packages/__pycache__
  - find /app/lib/python3.*/site-packages -name "*.pyc" -delete
  - rm -rf /app/lib/python3.*/site-packages/tests
  - rm -rf /app/lib/python3.*/site-packages/*/*/tests
  - rm -rf /app/pip

cleanup:
  - "**/tests"
  - "**/__pycache__"
  - "**/*.pyc"
  - "**/include"

modules:
  - name: barbaros
    build-options:
      build-args:
        - --share=network
    buildsystem: simple
    build-commands:
      - echo ${FLATPAK_DEST} # /app
      - echo ${PWD} # /run/build/barbaros
      # Install dependencies (without PySide6, since it is provided by BaseApp)
      - pip3 install --verbose --prefix=${FLATPAK_DEST} -r requirements-flatpak.txt
      # Install the application with pip without pulling in dependencies
      - pip3 install --no-deps --verbose --exists-action=i --find-links="file://${PWD}/dist" --prefix=${FLATPAK_DEST} "barbaros"
      # Copy files
      - install -Dm644 io.github.frimn.barbaros.desktop /app/share/applications/io.github.frimn.barbaros.desktop
      - install -Dm644 icon3.png /app/share/icons/hicolor/256x256/apps/io.github.frimn.barbaros.png
    sources:
      # Specify the source of your application code
      # Copy the .tar.gz and .whl files
      - type: dir
        path: ../dist
        dest: dist/
      - type: file
        path: requirements-flatpak.txt
      # Data files (.desktop, icons) must also be included
      - type: file
        path: io.github.frimn.barbaros.desktop
      - type: file
        path: icon3.png
      # - type: file
      #   path: io.github.frimn.barbaros.metainfo.xml
    cleanup:
      - "dist/"
