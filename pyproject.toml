# Docs: https://packaging.python.org/en/latest/guides/writing-pyproject-toml

[project]
name = "barbaros"
description = "AI Translation app"
keywords = ["translation", "ai", "qt", "gui", "pyside6", "machine-translation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Operating System :: POSIX :: Linux",
    "Framework :: PySide",
    "Intended Audience :: End Users/Desktop",
]
readme = "README.md"
authors = [{ name = "Nik Volkov", email = "freezemandix@ya.ru" }]
license = "MIT"
license-files = ["LICEN[CS]E*"]
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
    "pyside6-essentials",
    "psutil",
    "any-llm-sdk[all]",
    "keyring>=25.7.0",
    "psygnal>=0.15.1",
    "dataclasses-json>=0.6.7",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "invoke",
    "pyside6"
]

[project.gui-scripts]
barbaros = "barbaros.main:main"

[project.urls]
Homepage = "https://github.com/FRiMN/barbaros"
Issues = "https://github.com/FRiMN/barbaros/issues"

[build-system]
requires = ["setuptools>=61", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
write_to = "src/barbaros/__version__.py"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
barbaros = ["i18n/*.qm", "i18n/*.ts"]

[tool.setuptools.data-files]
"share/applications" = ["flatpak/io.github.frimn.barbaros.desktop"]
"share/icons/hicolor/256x256/apps" = ["src/barbaros/resources/icons/icon3.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E741", # Ambiguous variable name
    "E501", # Line too long
]
