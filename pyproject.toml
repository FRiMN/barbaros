# Docs: https://packaging.python.org/en/latest/guides/writing-pyproject-toml

[project]
name = "barbaros"
description = "AI-powered machine translation application with PySide6 GUI"
keywords = ["translation", "ai", "qt", "gui", "pyside6", "machine-translation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
#    "Operating System :: OS Independent",
    "Operating System :: POSIX :: Linux",
    "Framework :: PySide",
    "Intended Audience :: End Users/Desktop",
]
readme = "README.md"
authors = [{ name = "Nik Volkov", email = "freezemandix@ya.ru" }]
license = "MIT"
license-files = ["LICEN[CS]E*"]
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
    # Full pyside6 in dev group for language tools; main deps use pyside6-essentials for lighter footprint.
    # Pinned to the minor line (~=x.y.z): patch updates are allowed, a new
    # minor must be reviewed and bumped explicitly (see docs/settings-migration.md
    # for the PySide6 6.12 / any-llm 1.50 upgrade that broke startup).
    # BAR-29 (#20): 6.12.0 wheels leak a reference to None/True on every void Qt
    # call and Signal.emit; on CPython < 3.12 those singletons are mutable, so the
    # leak aborts the process. Stay on 6.11 until the upstream build fix (6.12.1)
    # is released; see docs/pyside6-6.12-refcount.md for the removal procedure.
    "pyside6-essentials~=6.11.0; python_version < '3.12'",
    "pyside6-essentials~=6.12.0; python_version >= '3.12'",
    "psutil~=7.2.2",
    "any-llm-sdk[all]~=1.50.0",
    "keyring~=25.7.0",
    "psygnal~=0.16.1",
    "dataclasses-json~=0.6.7",
]

[dependency-groups]
dev = [
    "ruff~=0.17.4",
    "pytest~=9.2.0",
    "invoke~=3.0.3",
    # Used directly by tests/system/test_pyside_refcount_pin.py (marker/specifier
    # checks); pytest only brings it in transitively, so declare it here.
    "packaging~=25.0",
    # Same BAR-29 split as the runtime dependency above.
    "pyside6~=6.11.0; python_version < '3.12'",
    "pyside6~=6.12.0; python_version >= '3.12'",
]

[project.gui-scripts]
barbaros = "barbaros.main:main"

[project.urls]
Homepage = "https://github.com/FRiMN/barbaros"
Issues = "https://github.com/FRiMN/barbaros/issues"
Repository = "https://github.com/FRiMN/barbaros"

[build-system]
# Requires setuptools >= 77.0.0 (PEP 639 license string syntax)
requires = ["setuptools>=77.0.1", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
write_to = "src/barbaros/__version__.py"
fallback_version = "0.0.0"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
barbaros = ["i18n/*.qm", "i18n/*.ts"]

[tool.setuptools.data-files]
"share/applications" = ["flatpak/io.github.frimn.barbaros.desktop"]
"share/icons/hicolor/256x256/apps" = ["src/barbaros/resources/icons/icon3.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The NFR timing tests are opt-in: their budgets are generous but would make
# the default suite slow and flaky on loaded machines. Run with `-m slow`.
addopts = "-m 'not slow'"
markers = [
    "slow: long-running and non-functional (timing/memory) tests",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E741", # Ambiguous variable name
    "E501", # Line too long
]
